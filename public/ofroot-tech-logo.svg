<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 174 48" role="img" aria-labelledby="ofroot-logo-title ofroot-logo-description">
  <title id="ofroot-logo-title">OfRoot Tech</title>
  <desc id="ofroot-logo-description">Three rounded paths converge into one upward stem beside the OfRoot Tech wordmark.</desc>
  <defs>
    <linearGradient id="ofroot-mark-gradient" x1="5" y1="42" x2="43" y2="5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B6F6B"/>
      <stop offset="0.52" stop-color="#20B2AA"/>
      <stop offset="1" stop-color="#72E1D0"/>
    </linearGradient>
    <linearGradient id="ofroot-word-gradient" x1="116" y1="32" x2="164" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#20B2AA"/>
      <stop offset="1" stop-color="#72E1D0"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#ofroot-mark-gradient)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 40C6 33 13 31 19 27C22 25 24 22 24 18"/>
    <path d="M42 40C42 33 35 31 29 27C26 25 24 22 24 18"/>
