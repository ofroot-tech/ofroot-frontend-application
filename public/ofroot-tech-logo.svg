  <text x="50" y="31.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="700">
    <tspan fill="#FFFFFF">ofroot</tspan>
    <tspan fill="url(#ofroot-word-gradient)"> tech</tspan>
  </text>
