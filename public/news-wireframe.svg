<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1480" viewBox="0 0 1740 1480" role="img" aria-labelledby="title desc">
  <title id="title">OfRoot Signal: desktop and mobile news wireframe</title>
  <desc id="desc">An editorial news index with topic navigation, a lead reference, source attribution, chronological feed, search, saved references, and transparent freshness. This structural wireframe contains no actual news stories.</desc>
